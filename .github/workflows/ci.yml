name: Editor
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev mesa-vulkan-drivers
      - run: python3 tools/test_pc_line_attribution.py
      - run: rustup show
      - run: make bootstrap
      - run: make verify-components
      - run: make material-audit
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2021 --check emu/crates/frontend/src/editor_assets.rs emu/crates/frontend/src/editor_preview.rs emu/crates/frontend/src/editor_textures.rs emu/crates/frontend/src/embedded_playtest.rs emu/crates/frontend/src/playtest_disc.rs
      - run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path engine/examples/editor-playtest/Cargo.toml -- --check
      - run: cargo check --locked --workspace --all-features
      - run: cargo test --locked --workspace --features frontend/editor
      - run: cargo check --locked --manifest-path engine/Cargo.toml --workspace --all-features
      - run: cargo test --locked --manifest-path engine/Cargo.toml -p psx-game-runtime -p psx-render-contract -p psx-chainloader -p psx-goldsrc
      # editor-playtest declares its own [workspace], so none of the commands
      # above reach it. Its tests run against a checked-in fixture manifest, not
      # whatever project was last cooked into generated/.
      - run: cargo test --locked --manifest-path engine/examples/editor-playtest/Cargo.toml
      - run: make lint
