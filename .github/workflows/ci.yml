name: Editor
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev mesa-vulkan-drivers
      - run: python3 tools/test_sony_material_audit.py
      - run: python3 tools/test_hwtest_tools.py
      - run: python3 tools/test_pc_line_attribution.py
      - run: python3 tools/sony-material-audit.py
      - run: rustup show
      - run: python3 tools/bootstrap-components.py
      - run: python3 tools/bootstrap-components.py --check
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-features
      - run: cargo test --locked --workspace
      - run: cargo check --locked --manifest-path engine/Cargo.toml --workspace --all-features
      - name: Run GoldSrc semantic oracles
        run: |
          for oracle in engine/crates/psx-goldsrc/tests/*_oracle.py; do
            python3 "$oracle" || exit "$?"
          done
      - run: cargo test --locked --manifest-path engine/Cargo.toml -p psx-game-runtime -p psx-render-contract -p psx-chainloader -p psx-goldsrc
      - run: make lint
