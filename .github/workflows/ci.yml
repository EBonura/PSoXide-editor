name: Editor
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev mesa-vulkan-drivers
      - run: rustup show
      - run: make bootstrap
      - run: make verify-components
      - run: make material-audit
      - run: make fmt-check
      - run: make check CARGO_FLAGS=--locked
      - run: cargo test --locked --workspace --features psoxide-emulator/editor
      - run: make lint
