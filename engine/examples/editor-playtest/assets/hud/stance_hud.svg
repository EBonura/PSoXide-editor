<svg xmlns="http://www.w3.org/2000/svg" width="176" height="32" viewBox="0 0 176 32">
  <!--
    Cortex stance HUD, first pass (concept: cortex-hud/03-concept-final-r11.png).
    Units are screen pixels. Stance-coloured parts are authored in greys and tinted at
    runtime (multiply), so one asset serves Horizon (red) and Zenith (cyan). Fixed-colour
    parts (rail, crystals) are authored in amber.

    Draw order, back to front, for the active bar:
      plate, health_0..health_N (lit cells), emblem, emblem_core
    The inactive bar is `plate` + its lit `health_i` again, dimmed and offset up.
    Energy: rail, then energy_i for each lit crystal (glow_i first, additive).
  -->
  <defs>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/><stop offset="0.5" stop-color="#b6b6b6"/>
      <stop offset="1" stop-color="#767676"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8d8"/><stop offset="0.45" stop-color="#b4b4b4"/>
      <stop offset="1" stop-color="#868686"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/><stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeaa6"/><stop offset="0.5" stop-color="#ffb41e"/>
      <stop offset="1" stop-color="#d86c00"/>
    </linearGradient>
  </defs>

